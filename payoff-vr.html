<title>No. 1 Payoff VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-bleed 3D scene with a thin HUD strip top and a message bar bottom. Single dark look (factory floor). */
:root{
  color-scheme: dark;
  --bg:#171b1c; --hud:rgba(18,23,24,.88); --fg:#e8ebe4; --mute:#9fa9a4;
  --teal:#4aa39b; --amber:#f0b634; --red:#e0533f; --line:rgba(232,235,228,.14);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--display)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:2}
.brand{display:flex;flex-direction:column;line-height:1;background:var(--hud);border:1px solid var(--line);border-radius:6px;padding:7px 11px;margin-right:auto}
.brand b{font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-size:13px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
button{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:var(--hud);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;pointer-events:auto}
button:hover{border-color:var(--teal)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.primary{background:var(--teal);color:#0d1514;border-color:transparent;font-weight:700}
button.primary:disabled{background:#3b4442;color:var(--mute);cursor:default}
.views{display:flex;gap:6px;flex-wrap:wrap}
.foot{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;z-index:2}
#msg{font-size:17px;font-weight:600;letter-spacing:.02em;background:var(--hud);border-left:4px solid var(--amber);padding:7px 12px;border-radius:4px;max-width:min(680px,100%)}
#msg.info{border-left-color:var(--teal)}
#msg:empty{display:none}
#hint{font-size:15px;color:var(--mute);background:var(--hud);padding:6px 11px;border-radius:4px;max-width:min(680px,100%)}
#vrnote{font-size:14px;color:var(--fg);background:var(--hud);border:1px solid var(--amber);padding:8px 12px;border-radius:4px;max-width:min(680px,100%);pointer-events:auto}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:var(--bg);z-index:3}
@media (max-width:520px){.brand span{display:none} button{padding:7px 9px;font-size:14px}}
</style>

<canvas id="c" aria-label="3D model of the No. 1 payoff, coil car and main console"></canvas>
<div class="hud">
  <div class="brand"><b>No. 1 Payoff</b><span>Coil coating line · entry trainer</span></div>
  <button id="vr" class="primary" disabled>Checking VR…</button>
  <div class="views" role="group" aria-label="Viewpoints">
    <button data-view="console">Console</button>
    <button data-view="arbor">Arbor</button>
    <button data-view="pinch">Pinch roll</button>
    <button data-view="car">Coil car</button>
  </div>
</div>
<div class="foot">
  <div id="msg"></div>
  <div id="hint">Drag to look around. Click a panel button to press it, and hold it for jog and travel moves. Follow the steps on the board left of the console.</div>
  <div id="vrnote" hidden></div>
</div>
<div id="loading">Building the line…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
const T = THREE, PI = Math.PI;
const FONT = '"Barlow Condensed","Arial Narrow",Arial,sans-serif';
const MARKER = '"Permanent Marker","Comic Sans MS",cursive';
try{ await Promise.race([Promise.all([document.fonts.load('700 40px "Barlow Condensed"'),document.fonts.load('600 40px "Barlow Condensed"'),document.fonts.load('40px "Permanent Marker"')]), new Promise(r=>setTimeout(r,2500))]); }catch(e){}

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = T.sRGBEncoding;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor'); if(renderer.xr.setFoveation) renderer.xr.setFoveation(1);
const scene = new T.Scene();
scene.background = new T.Color(0x2b2f2d);
scene.fog = new T.Fog(0x2b2f2d, 20, 48);
const camera = new T.PerspectiveCamera(68, innerWidth/innerHeight, 0.03, 90);
const dolly = new T.Group(); dolly.add(camera); scene.add(dolly);
scene.add(new T.HemisphereLight(0xe4ebee, 0x40392f, 0.95));
const sun = new T.DirectionalLight(0xfff6e8, 0.75); sun.position.set(6,12,8); scene.add(sun);
const fill = new T.DirectionalLight(0xcfe3ff, 0.25); fill.position.set(-8,6,-6); scene.add(fill);

/* ---------- helpers ---------- */
const mat = (c,r=.72,m=.18,o={}) => new T.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o));
const B = (w,h,d) => new T.BoxGeometry(w,h,d);
const Cx = (r,h,s=24) => new T.CylinderGeometry(r,r,h,s).rotateZ(PI/2);   // axis along x
const Cz = (r,h,s=24) => new T.CylinderGeometry(r,r,h,s).rotateX(PI/2);   // axis along z
const Cy = (r,h,s=24) => new T.CylinderGeometry(r,r,h,s);
function add(parent, geo, m, x=0,y=0,z=0){ const o=new T.Mesh(geo,m); o.position.set(x,y,z); parent.add(o); return o; }
function canvasTex(w,h,fn,opts={}){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); fn(g,w,h); const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=8; if(opts.repeat){t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(opts.repeat[0],opts.repeat[1]);} t.userData={c,g,fn}; return t; }
function redraw(t){ const {c,g,fn}=t.userData; g.clearRect(0,0,c.width,c.height); fn(g,c.width,c.height); t.needsUpdate=true; }
function fit(g,text,x,y,maxW,size,weight='700',family=FONT){ let s=size; g.font=`${weight} ${s}px ${family}`; while(g.measureText(text).width>maxW && s>8){ s--; g.font=`${weight} ${s}px ${family}`; } g.fillText(text,x,y); return s; }
function speckle(g,w,h,n,base,spread,alpha){ for(let i=0;i<n;i++){ const v=base+Math.random()*spread; g.fillStyle=`rgba(${v},${v},${v-6},${Math.random()*alpha})`; g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3);} }
const UP = new T.Vector3(0,1,0), tmpV=new T.Vector3(), tmpV2=new T.Vector3(), tmpQ=new T.Quaternion();
function setBetween(mesh,a,b){ tmpV.subVectors(b,a); const L=tmpV.length(); mesh.position.copy(a).addScaledVector(tmpV,.5); mesh.quaternion.setFromUnitVectors(UP,tmpV.normalize()); mesh.scale.set(1,Math.max(L,1e-4),1); }
function hydCyl(parent,rb=.05,rr=.022){ const barrel=add(parent,Cy(rb,1,14),MAT.black); const rod=add(parent,Cy(rr,1,12),MAT.chrome); return (a,b,bl=.6)=>{ setBetween(rod,a,b); const L=a.distanceTo(b); tmpV2.subVectors(b,a).normalize().multiplyScalar(Math.min(bl,L*.92)).add(a); setBetween(barrel,a,tmpV2); }; }

/* ---------- textures & materials ---------- */
const grime = (base,n=1)=>canvasTex(512,512,(g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); speckle(g,w,h,3500*n,60,70,.22); g.strokeStyle='rgba(40,30,20,.18)'; for(let i=0;i<60*n;i++){ g.lineWidth=Math.random()*2; g.beginPath(); const x=Math.random()*w,y=Math.random()*h; g.moveTo(x,y); g.lineTo(x+(Math.random()-.5)*120,y+(Math.random()-.5)*40); g.stroke(); } for(let i=0;i<14*n;i++){ g.fillStyle=`rgba(${110+Math.random()*40},${60+Math.random()*20},30,${Math.random()*.25})`; g.beginPath(); g.ellipse(Math.random()*w,Math.random()*h,Math.random()*28,Math.random()*12,Math.random()*3,0,7); g.fill(); } });
const tealTex = grime('#4a9c95'), blueTex = grime('#2d4f97',.6), consoleTex = grime('#aaa79d',1.4);
const MAT = {
  teal: mat(0xffffff,.72,.2,{map:tealTex}), tealPlain: mat(0x3f948e,.72,.2),
  blue: mat(0xffffff,.6,.25,{map:blueTex}), yellow: mat(0xe2bd1d,.6,.12),
  steel: mat(0x9aa1a5,.38,.8), chrome: mat(0xe2e6e9,.16,1), dark: mat(0x2a2d2f,.6,.45),
  black: mat(0x141516,.5,.25), rubber: mat(0x1b1b1b,.92,0), mandrel: mat(0x45494c,.38,.78),
  rust: mat(0x6e3b2d,.82,.2), console: mat(0xffffff,.5,.55,{map:consoleTex}), plug: mat(0x8d8c86,.6,.5),
  felt: mat(0xe6e1d6,.95,0), cream: mat(0xd8d2c0,.85,0), grey: mat(0x8b8f90,.8,.2), white: mat(0xe9e9e4,.7,.05),
  hub: mat(0x3e6fc1,.55,.3), red: mat(0xb8291c,.5,.15), orange: mat(0xd2602a,.6,.1)
};
const coilSide = canvasTex(512,64,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,w,0); gr.addColorStop(0,'#c2c6c9'); gr.addColorStop(.5,'#d6d9db'); gr.addColorStop(1,'#bfc3c6'); g.fillStyle=gr; g.fillRect(0,0,w,h); for(let i=0;i<120;i++){ g.fillStyle=`rgba(255,255,255,${Math.random()*.12})`; g.fillRect(Math.random()*w,0,Math.random()*5,h);} for(let i=0;i<60;i++){ g.fillStyle=`rgba(70,75,80,${Math.random()*.12})`; g.fillRect(Math.random()*w,0,Math.random()*3,h);} });
const coilEnd = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#b9bdc1'; g.fillRect(0,0,w,h); for(let r=77;r<256;r+=1.4){ const v=150+Math.random()*70; g.strokeStyle=`rgb(${v},${v+3},${v+6})`; g.lineWidth=1.2; g.beginPath(); g.arc(256,256,r,0,7); g.stroke(); } g.strokeStyle='rgba(30,140,60,.9)'; g.lineWidth=9; g.beginPath(); g.moveTo(256,256-80); g.lineTo(256,0); g.stroke(); g.strokeStyle='rgba(40,40,40,.6)'; g.lineWidth=3; g.beginPath(); g.moveTo(256+78,256); g.lineTo(512,256); g.stroke(); });
const MATcoil = mat(0xffffff,.3,.72,{map:coilSide});

/* ---------- state ---------- */
const MCX = -0.05;            // mandrel centre (arbor-group local x)
const CL = 1.30;              // mandrel centreline height (m)
const COIL_R = .85, COIL_RI = .254, COIL_W = 1.2;
const CAR_HOME = 4.6, FEED_LEN = 1.6, SHEAR_D = .62;
const NIP = new T.Vector3(0,1.25,2.9);
function fresh(){ return { estop:false, hydA:false, hydB:false, air:true, lineRun:false, arborSel:2, laser:false,
  carX:CAR_HOME, carLift:0, coilOnCar:true, coilOnMandrel:false, mandrelExp:1, mandrelTarget:'EXP', mAngle:0, coilAngle:0,
  hd:0, peelUp:0, peelExt:0, carriage:.5, pinchClosed:false, pinchGap:1, thread:0, feed:0, cropped:false, adj:0, shearAnim:0,
  jogging:false, moving:false }; }
let S = fresh();
const carStop = () => S.adj + MCX;
const enterX = () => S.adj + 0.85 + COIL_W/2 + 0.02;
const carCY = () => 1.06 + 0.24*S.carLift;
const carSupporting = () => Math.abs(S.carX-carStop())<0.004 && S.carLift>=0.999;

/* ---------- messages / audio ---------- */
let msg = {text:'',level:'info',t:-1e9};
const msgEl=document.getElementById('msg');
let actx=null;
function tone(f,d,type='square',vol=.04){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; g.gain.value=vol; g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function say(text, level='alarm'){ const now=performance.now(); if(text===msg.text && now-msg.t<2500) return false; msg={text,level,t:now}; msgEl.textContent=text; msgEl.className=level; if(level==='alarm'){ tone(520,.25,'sawtooth',.05); hapticAll(.8,80);} return false; }
function hydOK(){ if(S.estop) return say('E-STOP is active. Press the E-STOP again to reset it.'); if(!S.hydA) return say('Hydraulic pump A is off. Press HYD A ON on the left panel.'); return true; }

/* ---------- factory ---------- */
const floorTex = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#5d5f5b'; g.fillRect(0,0,w,h); speckle(g,w,h,9000,60,60,.3); g.fillStyle='rgba(25,25,25,.15)'; for(let i=0;i<10;i++){ g.beginPath(); g.ellipse(Math.random()*w,Math.random()*h,20+Math.random()*80,10+Math.random()*40,Math.random()*3,0,7); g.fill(); } g.strokeStyle='rgba(20,20,20,.5)'; g.lineWidth=2; g.strokeRect(0,0,w,h); },{repeat:[14,10]});
add(scene,new T.PlaneGeometry(64,44).rotateX(-PI/2),mat(0xffffff,.92,.05,{map:floorTex}),2,0,0);
const checker = canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#7d8083'; g.fillRect(0,0,w,h); g.fillStyle='#a6a9ab'; for(let y=0;y<h;y+=16) for(let x=(y/16%2)*8;x<w;x+=16){ g.save(); g.translate(x+4,y+4); g.rotate(.6); g.fillRect(-5,-1.5,10,3); g.restore(); } },{repeat:[24,1]});
const checkerMat = mat(0xffffff,.5,.6,{map:checker});
// coil car rail pit
add(scene,new T.PlaneGeometry(8.6,1.5).rotateX(-PI/2),mat(0x2e302f,.9,.1),2.9,.003,0);
for(const z of [-.55,.55]) add(scene,B(8.6,.05,.07),MAT.steel,2.9,.025,z);
for(const z of [-.98,.98]) add(scene,new T.PlaneGeometry(8.6,.34).rotateX(-PI/2),checkerMat,2.9,.004,z);
const redPaint = canvasTex(256,128,(g,w,h)=>{ for(let i=0;i<220;i++){ g.fillStyle=`rgba(200,40,30,${Math.random()*.6})`; g.fillRect(Math.random()*w,Math.random()*h,Math.random()*12,Math.random()*4);} });
add(scene,new T.PlaneGeometry(2.4,1.2).rotateX(-PI/2),new T.MeshBasicMaterial({map:redPaint,transparent:true,depthWrite:false}),5.9,.005,1.6);
// building columns, roof, walls
for(const x of [-9,-1,7,15]) for(const z of [-10,12]){ add(scene,B(.45,9.4,.45),MAT.rust,x,4.7,z); }
for(const x of [-9,-1,7,15]) add(scene,B(.3,.55,22.5),MAT.rust,x,9.1,1);
for(let z=-10;z<=12;z+=2.75) add(scene,B(24.5,.12,.12),MAT.rust,3,8.9,z);
add(scene,new T.PlaneGeometry(26,24).rotateX(PI/2),mat(0x3a3d3c,.9,.1),3,9.5,1);
const wallTex = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#b9bcbd'; g.fillRect(0,0,w,h); for(let x=0;x<w;x+=16){ g.fillStyle='rgba(60,60,60,.18)'; g.fillRect(x,0,5,h);} g.fillStyle='rgba(255,255,255,.75)'; g.fillRect(0,20,w,46); for(let x=0;x<w;x+=32){ g.fillStyle='#596060'; g.fillRect(x,20,3,46);} },{repeat:[10,1]});
add(scene,new T.PlaneGeometry(26,9.4),mat(0xffffff,.85,.1,{map:wallTex}),3,4.7,-10.8);
const wallR = add(scene,new T.PlaneGeometry(24,9.4),mat(0xffffff,.85,.1,{map:wallTex}),15.6,4.7,1); wallR.rotation.y=-PI/2;
const wallL = add(scene,new T.PlaneGeometry(24,9.4),mat(0xffffff,.85,.1,{map:wallTex}),-9.6,4.7,1); wallL.rotation.y=PI/2;
const lampMat = new T.MeshBasicMaterial({color:0xf4f7f2});
for(const x of [-5,3,11]) for(const z of [-6,0,6]) add(scene,B(1.4,.06,.18),lampMat,x,8.2,z);
// overhead crane
add(scene,B(.5,.7,20),MAT.yellow,3.2,7.6,1); const hoist=add(scene,B(.6,.5,.6),MAT.red,3.2,7.0,-2.8); add(scene,Cy(.012,3.2),MAT.dark,3.2,5.2,-2.8); add(scene,B(.18,.25,.1),MAT.red,3.2,3.6,-2.8);
// guardrails
function rail(x1,z1,x2,z2){ const a=new T.Vector3(x1,0,z1), b=new T.Vector3(x2,0,z2); const L=a.distanceTo(b), n=Math.max(1,Math.round(L/1.2));
  for(let i=0;i<=n;i++){ const p=a.clone().lerp(b,i/n); add(scene,B(.06,1.07,.06),MAT.yellow,p.x,.535,p.z);}
  for(const y of [1.05,.55]){ const m=add(scene,B(.05,.05,L),MAT.yellow,0,y,0); m.position.set((x1+x2)/2,y,(z1+z2)/2); m.rotation.y=Math.atan2(x2-x1,z2-z1);} }
rail(-3.1,-3.0,3.0,-3.0); rail(-3.1,-3.0,-3.1,2.2); rail(1.3,1.9,1.3,1.2);
// background coils & cores
function makeCoil(R,ri,w,tint=0xffffff){ const g=new T.Group(); const m=MATcoil.clone(); m.color.setHex(tint);
  add(g,new T.CylinderGeometry(R,R,w,56,1,true).rotateZ(PI/2),m);
  add(g,new T.CylinderGeometry(ri,ri,w,32,1,true).rotateZ(PI/2),mat(0x8e9195,.4,.7,{side:T.BackSide}));
  const em = mat(tint,.42,.6,{map:coilEnd}); const ring=new T.RingGeometry(ri,R,56,1);
  const e1=add(g,ring,em,w/2,0,0); e1.rotation.y=PI/2; const e2=add(g,ring,em,-w/2,0,0); e2.rotation.y=-PI/2;
  add(g,B(w*1.002,.006,.04),mat(0x6d7276,.5,.6),0,R,0); return g; }
for(const [x,z,t] of [[10,-6,0xffffff],[11.8,-6,0xd9c39a],[10,-3.6,0xf0f0f0],[11.8,-3.6,0xb08a6a],[10,6,0xffffff],[11.8,7.4,0xd9c39a]]){ const c=makeCoil(.8,.254,1.2,t); c.position.set(x,.8,z); c.rotation.y=PI/2; scene.add(c); add(scene,B(1.3,.08,1.5),MAT.yellow,x,.04,z); }
for(const [x,z,h,r] of [[-2.5,1.4,1.05,.27],[-2.0,1.75,.95,.27],[-2.6,2.1,.35,.3],[-1.9,2.3,.35,.3]]) add(scene,new T.CylinderGeometry(r,r,h,28,1,true),mat(0x232425,.7,.3,{side:T.DoubleSide}),x,h/2,z);
add(scene,new T.CylinderGeometry(.27,.24,.85,24),mat(0x46596a,.8,.1),-1.6,.425,3.3);
// downstream leveler / entry section
const lev=new T.Group(); scene.add(lev); lev.position.set(0,0,6.9);
add(lev,B(2.4,1.25,2.6),MAT.teal,0,.62,0); add(lev,B(2.0,.5,2.2),MAT.tealPlain,0,1.5,0); add(lev,B(2.6,.08,3.0),MAT.dark,0,1.8,0);
for(const x of [-1.3,1.3]) for(const z of [-1.5,1.5]) add(lev,B(.06,1.07,.06),MAT.yellow,x,2.37,z);
add(lev,B(2.6,.05,.05),MAT.yellow,0,2.9,-1.5); add(lev,B(2.6,.05,.05),MAT.yellow,0,2.9,1.5); add(lev,B(.05,.05,3),MAT.yellow,-1.3,2.9,0); add(lev,B(.05,.05,3),MAT.yellow,1.3,2.9,0);
// exit table between shear and leveler
add(scene,B(1.5,.06,1.7),MAT.steel,0,1.18,4.45); add(scene,B(1.3,1.12,1.4),MAT.teal,0,.56,4.45);

/* ---------- ARBOR (No. 1 payoff) ---------- */
const arbor = new T.Group(); scene.add(arbor);
add(arbor,B(1.1,.22,1.8),MAT.tealPlain,-1.45,.11,0);
add(arbor,B(1.0,1.55,1.5),MAT.teal,-1.45,.99,0);
add(arbor,B(.85,.45,1.2),MAT.teal,-1.5,1.95,0);
add(arbor,Cx(.33,.16,32),MAT.dark,-.87,CL,0);
add(arbor,Cx(.28,.6,28),MAT.tealPlain,-2.15,1.95,.35); // drive motor
for(let i=0;i<6;i++) add(arbor,B(.12,.08,.12),MAT.dark,-1.95+i*.05,.4+i*.2,.76);
const spin = new T.Group(); spin.position.set(MCX+.05,CL,0); arbor.add(spin);
add(spin,Cx(.19,1.72,24),MAT.dark,-.05,0,0);

  const uy=NIP.y+.1+.12*S.pinchGap; upRoll.position.y=uy; chocks.forEach(c=>c.position.y=uy);
  pinchCyl[0](new T.Vector3(-.86,.25,NIP.z+.24),new T.Vector3(-.86,uy,NIP.z+.24),.6); pinchCyl[1](new T.Vector3(.86,.25,NIP.z+.24),new T.Vector3(.86,uy,NIP.z+.24),.6);
  blade.position.y=1.48-.3*Math.sin(S.shearAnim*PI);

  const sx=S.adj+MCX;
  if(S.coilOnMandrel && S.thread>0){ const a=.72; const s0=new T.Vector3(sx,CL-COIL_R*Math.cos(a),COIL_R*Math.sin(a)); const nip=new T.Vector3(sx,NIP.y,NIP.z); const head=s0.clone().lerp(nip,S.thread);
    stripA.visible=true; stripA.position.copy(s0); stripA.lookAt(head); stripA.scale.set(1,1,Math.max(.001,s0.distanceTo(head))); }
  else stripA.visible=false;
  if(S.coilOnMandrel && S.feed>0){ stripB.visible=true; stripB.position.set(sx,NIP.y,NIP.z); stripB.rotation.set(0,0,0); stripB.scale.set(1,1,S.feed*FEED_LEN); } else stripB.visible=false;
  for(const s of scraps){ if(s.position.y>.02){ s.userData.v+=9.8*dt; s.position.y=Math.max(.02,s.position.y-s.userData.v*dt); s.rotation.x+=s.userData.spin*dt; if(s.position.y<=.02){ s.rotation.x=0; } } }
  // laser
  const lx=carStop(); laserFloor.visible=laserBeam.visible=S.laser; laserFloor.position.x=lx;
  if(S.laser){ const topY=S.coilOnCar&&Math.abs(S.carX-lx)<COIL_W/2? cy+COIL_R : S.coilOnMandrel? CL+COIL_R : .01; laserBeam.position.set(lx,(4.53+topY)/2,0); laserBeam.scale.y=4.53-topY; }
  laserHead.position.x=lx;
  // lights
  const now=performance.now(); const alarmLive=msg.level==='alarm'&&now-msg.t<6000;
  const st=[S.estop, alarmLive&&!S.estop, S.hydA&&!S.estop, S.lineRun];
  stackSeg.forEach((m,i)=>m.material.emissiveIntensity= st[i]? (i===1? (Math.sin(now/180)>0?1.8:.3) : 1.8) : .05);
  beacon.material.emissiveIntensity = S.moving ? (Math.sin(now/120)>0?2:.4) : .08;
  for(const c of ctrls){ const d=c.d; if(c.lens) c.lens.material.emissiveIntensity= d.lit&&d.lit()? 1.7 : .05;
    if(c.knob){ const v= d.get? d.get() : c.val; c.knob.rotation.z += ((v? -.75:.75) - c.knob.rotation.z)*Math.min(1,dt*18); }
    if(c.cap) c.cap.position.z = c.rest - (c.down>0? .005:0); }
  // steps
  if(done.indexOf(false)>=0){ for(let i=0;i<STEPS.length;i++){ if(done[i]) continue; if(STEPS[i][1]()){ done[i]=true; tone(1046,.12,'sine',.05); if(i===STEPS.length-1){ finishT=now; say('Coil loaded, threaded and cropped. Well done.','info'); } } break; } }
  // throttled textures
  uiT+=dt; if(uiT>.25){ uiT=0; redraw(hmiTex); redraw(boardTex); }
  if(lastScale!==S.coilOnCar){ lastScale=S.coilOnCar; redraw(scaleTex); }
  if(lastJog!==S.jogging){ lastJog=S.jogging; redraw(counterTex); }
}
function loop(){ const dt=Math.min(.05,clock.getDelta());
  if(renderer.xr.isPresenting){ if(pendingStart>0){ pendingStart--; if(pendingStart===0) goTo(PADS.console); } locomotion(dt); updateXRPointers(); hoverRing.visible=false; } else { controls.update(); }
  update(dt); renderer.render(scene,camera); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
setView('console');
renderer.setAnimationLoop(loop);
document.getElementById('loading').hidden=true;
})().catch(err=>{ const l=document.getElementById('loading'); l.hidden=false; l.textContent='Could not build the scene: '+(err&&err.message||err); console.error(err); });
